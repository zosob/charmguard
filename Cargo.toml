[package]
name = "charmguard"
version = "0.3.0"
edition = "2024"

[dependencies]
# Core Dependencies 
clap = {version="4.5", features=["derive"]}
chrono = "0.4"
serde = { version="1.0", features=["derive"]}
serde_json="1.0"
tokio = {version = "1", features = ["rt-multi-thread","macros"]}

# System monitoring
sysinfo = {version = "0.29.10"}

#GUI 
colored = "2"
eframe = { version = "0.27", features = ["default_fonts", "glow"] }
egui_extras = "0.31.1"
egui = "0.26"

#YAML blocklist
serde_yaml = "0.9"

windows = { version = "0.56", features = ["Win32_UI_WindowsAndMessaging"]}

widestring = "1.0"
actix-web = "4"

#HTTP Client
reqwest = { version = "0.11", features = ["json"]}

rand = "0.8"


[lib]
name="charmguard"
path="src/lib.rs"

[[bin]]
name="charmguard-api"
path="src/api.rs"

[[bin]]
name="charmguard-gui"
path="src/gui.rs"
